<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>George's Calendar App</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="logo.svg" alt="" class="brand-logo">
      <span class="brand-name">George's Calendar App</span>
    </div>
    <button class="btn-outline" id="todayBtn" title="Today (T)">Today</button>
    <button class="icon-btn" id="prevBtn" title="Previous (←)" aria-label="Previous">&#x2039;</button>
    <button class="icon-btn" id="nextBtn" title="Next (→)" aria-label="Next">&#x203A;</button>
    <h1 class="period-title" id="periodTitle"></h1>
    <div class="spacer"></div>
    <div class="view-switch" role="tablist">
      <button data-view="day" title="Day (D)">Day</button>
      <button data-view="week" title="Week (W)">Week</button>
      <button data-view="month" title="Month (M)">Month</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <button class="create-btn" id="createBtn" title="Create event (C)">
        <svg viewBox="0 0 36 36" width="32" height="32" aria-hidden="true">
          <path fill="#34A853" d="M16 16v14h4V20z"/><path fill="#4285F4" d="M30 16H20l-4 4h14z"/>
          <path fill="#FBBC05" d="M6 16v4h10l4-4z"/><path fill="#EA4335" d="M20 16V6h-4v14z"/>
        </svg>
        <span>Create</span>
      </button>

      <div class="mini-cal">
        <div class="mini-head">
          <span id="miniTitle"></span>
          <div>
            <button class="icon-btn small" id="miniPrev" aria-label="Previous month">&#x2039;</button>
            <button class="icon-btn small" id="miniNext" aria-label="Next month">&#x203A;</button>
          </div>
        </div>
        <div class="mini-grid" id="miniGrid"></div>
      </div>

      <div class="monkey-card" id="monkeyCard"></div>

      <div class="legend">
        <span class="banana">🍌</span> = holiday
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <!-- Event editor -->
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <form class="modal" id="eventForm" autocomplete="off">
      <div class="modal-head">
        <span id="modalHeading">New event</span>
        <button type="button" class="icon-btn" id="closeModal" aria-label="Close">&#x2715;</button>
      </div>
      <input class="title-input" id="fTitle" placeholder="Add title" maxlength="200">

      <div class="row">
        <span class="row-icon">🕒</span>
        <input type="date" id="fDate" required>
        <span class="time-fields" id="timeFields">
          <input type="time" id="fStart">
          <span>–</span>
          <input type="time" id="fEnd">
        </span>
      </div>
      <div class="row indent">
        <label class="check"><input type="checkbox" id="fAllDay"> All day</label>
        <select id="fRepeat">
          <option value="none">Does not repeat</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>

      <div class="row">
        <span class="row-icon">🔔</span>
        <select id="fReminder">
          <option value="-1">No reminder</option>
          <option value="0">At time of event</option>
          <option value="5">5 minutes before</option>
          <option value="10">10 minutes before</option>
          <option value="15">15 minutes before</option>
          <option value="30">30 minutes before</option>
          <option value="60">1 hour before</option>
          <option value="120">2 hours before</option>
          <option value="1440">1 day before</option>
          <option value="10080">1 week before</option>
        </select>
      </div>

      <div class="row">
        <span class="row-icon">🎨</span>
        <div class="swatches" id="swatches"></div>
      </div>

      <div class="row top">
        <span class="row-icon">📝</span>
        <textarea id="fDesc" rows="3" placeholder="Add description"></textarea>
      </div>

      <div class="modal-foot">
        <button type="button" class="btn-text danger hidden" id="deleteBtn">Delete</button>
        <div class="spacer"></div>
        <button type="button" class="btn-text" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>

  <!-- Reminder popups -->
  <div class="alerts" id="alerts"></div>

  <script src="holidays.js"></script>
  <script src="monkeys.js"></script>
  <script src="app.js"></script>
</body>
</html>
